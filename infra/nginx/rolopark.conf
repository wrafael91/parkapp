# ParkApp (S2-06) - rolopark.com: HTTP -> HTTPS, TLS 1.2/1.3, HSTS, proxy to the API.

# TLS for every server on 443 (Mozilla "intermediate"; the certificate is ECDSA,
# so only ECDSA suites are listed for TLS 1.2. TLS 1.3 suites are not set here).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:TLS:10m;
ssl_session_tickets off;
# Hybrid post-quantum key exchange first (OpenSSL 3.5+); classic curves as fallback.
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

# Bare IP or unknown Host on port 80: close the connection without a response.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Bare IP or unknown name on port 443: reject the TLS handshake (no certificate is sent).
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name rolopark.com www.rolopark.com;

    # Let's Encrypt HTTP-01 challenge (certbot writes the token files here).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Everything else goes to HTTPS on the main name.
    location / {
        return 301 https://rolopark.com$request_uri;
    }
}

# www over HTTPS: redirect to the main name.
server {
    listen 443 ssl;
    http2 on;
    server_name www.rolopark.com;

    ssl_certificate     /etc/letsencrypt/live/rolopark.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolopark.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://rolopark.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rolopark.com;

    ssl_certificate     /etc/letsencrypt/live/rolopark.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rolopark.com/privkey.pem;

    # HSTS (RFC 6797): browsers will only use HTTPS for this domain and its subdomains.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Only the API is exposed for now; the web app is added in S2-08.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
