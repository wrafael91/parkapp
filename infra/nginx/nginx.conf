# ParkApp (S2-06). Package nginx.conf without the example site
# (original kept as nginx.conf.orig). Sites live in conf.d/.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not reveal the Nginx version in headers or error pages.
    server_tokens off;
    # The API only receives small JSON bodies.
    client_max_body_size 64k;

    include /etc/nginx/conf.d/*.conf;
}
