name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parkapp
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: parkapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkapp -d parkapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 3000
      DATABASE_URL: postgresql://parkapp:ci_only_password@localhost:5432/parkapp_ci?schema=public

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build
            - name: Create database roles
        env:
          PGHOST: localhost
          PGUSER: parkapp
          PGPASSWORD: ci_only_password
          PGDATABASE: parkapp_ci
        run: |
          psql -v ON_ERROR_STOP=1 -f db/bootstrap/roles.sql
          psql -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE parkapp_migrator LOGIN PASSWORD 'ci_migrator_password'" \
            -c "ALTER DATABASE parkapp_ci OWNER TO parkapp_migrator"

      - name: Apply migrations as parkapp_migrator
        env:
          DATABASE_URL: postgresql://parkapp_migrator:ci_migrator_password@localhost:5432/parkapp_ci?schema=public
        run: npx prisma migrate deploy
      - run: npm run test:coverage

      - name: Coverage summary
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.total | "| Metric | % |\n|---|---|\n| Lines | \(.lines.pct) |\n| Statements | \(.statements.pct) |\n| Functions | \(.functions.pct) |\n| Branches | \(.branches.pct) |"' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 14
